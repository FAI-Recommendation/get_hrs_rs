[project]
name = "get-hrs-rs"
version = "0.1.0"
description = "Hệ thống gợi ý thời trang cho thuê (Rental Fashion)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tensorflow>=2.15.0",
    "pandas>=2.0.0",
    "numpy<2.0.0",
    "scikit-learn",
    "pillow",
    "matplotlib",
    "seaborn",
    "tqdm",
    "ipykernel",
]

[tool.uv]
package = false  # QUAN TRỌNG: Dòng này báo uv chỉ quản lý thư viện, không cần build package

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"